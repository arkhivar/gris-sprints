<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grouped view — Grist widget</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget.css?v=5.1">
</head>
<body>
<div id="app">

  <header class="toolbar" role="toolbar" aria-label="Grouping options">
    <div class="toolbar-group">
      <label for="group-select">Group by</label>
      <select id="group-select">
        <option value="">— choose —</option>
      </select>
    </div>
    <div class="toolbar-sep" role="separator" aria-orientation="vertical"></div>
    <div class="toolbar-group">
      <label for="sort-select">Sort</label>
      <select id="sort-select">
        <option value="alpha-asc">A → Z</option>
        <option value="alpha-desc">Z → A</option>
        <option value="count-desc">Count ↓</option>
        <option value="count-asc">Count ↑</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button class="btn" id="btn-expand"   type="button">Expand all</button>
      <button class="btn" id="btn-collapse" type="button">Collapse all</button>
      <div class="toolbar-sep" role="separator" aria-orientation="vertical"></div>
      <span class="version-badge" id="version-badge" title="Widget version"></span>
      <button class="btn-icon" id="btn-settings" type="button"
              aria-label="Display settings" aria-expanded="false" aria-controls="settings-panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="settings-panel" id="settings-panel"
       role="region" aria-label="Display settings">

    <div>
      <p class="setting-section-title" id="lbl-colors">Group colors</p>
      <div class="color-grid" id="color-grid" aria-labelledby="lbl-colors"></div>
    </div>

    <div>
      <label for="limit-maxh-cb" id="lbl-limitmaxh"
             style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer">
        <input type="checkbox" id="limit-maxh-cb" style="accent-color:var(--accent)">
        <span id="lbl-limitmaxh-txt">Limit group height</span>
      </label>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <input type="range" id="maxh-range" min="80" max="600" step="20" value="200"
               style="flex:1;accent-color:var(--accent)" disabled>
        <span id="maxh-val" style="font-family:var(--mono);font-size:11px;color:var(--text);min-width:36px">200px</span>
        <button class="btn-reset-color" type="button" id="btn-reset-maxh"
                aria-label="Reset maximum height" disabled>Reset</button>
      </div>
    </div>

    <div id="bool-section" style="display:none">
      <p class="setting-section-title" id="lbl-bool">True / false display</p>
      <div class="bool-row" id="bool-row"
           role="radiogroup" aria-labelledby="lbl-bool"></div>
    </div>

    <div>
      <p class="setting-section-title" id="lbl-aggregates">Aggregates</p>
      <div class="agg-list" id="agg-list" aria-labelledby="lbl-aggregates"></div>
      <div class="agg-add-row">
        <select id="agg-fn-select"></select>
        <select id="agg-col-select"></select>
        <button class="btn" id="btn-add-agg" type="button">+ Add</button>
      </div>
    </div>

    <div>
      <p class="setting-section-title" id="lbl-diag">Diagnostics</p>
      <div class="diag-list" id="diag-list"></div>
    </div>

  </div>

  <div class="statsbar" id="statsbar" role="status" aria-live="polite" aria-atomic="true">
    <span><span class="stat-val" id="stat-groups">0</span> groups</span>
    <span aria-hidden="true">·</span>
    <span><span class="stat-val" id="stat-records">0</span> records</span>
  </div>

  <main class="content" id="content" aria-label="Record groups">
    <div class="empty" id="empty-state" role="status">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.2"
           aria-hidden="true" focusable="false">
        <rect x="3" y="3" width="18" height="18" rx="2.5"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      <p class="empty-title">No column selected</p>
      <p class="empty-sub">Choose a column in the toolbar above<br>to group records.</p>
    </div>
  </main>

  <div id="sel-bar" role="toolbar">
    <span id="sel-count-txt"></span>
    <button type="button" id="btn-sel-dup" class="sel-btn"></button>
    <button type="button" id="btn-sel-del" class="sel-btn sel-del"></button>
    <button type="button" id="btn-sel-clear" class="sel-btn"></button>
  </div>

</div>

<script src="widget-core.js?v=5.1"></script>
  <script src="widget-app.js?v=5.1"></script>
  <script src="widget-actions.js?v=5.1"></script>
</body>
</html>
